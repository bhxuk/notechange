name: Build

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
    paths-ignore: [ 'docs/**', '*.md' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Conversion tests
        run: dotnet test tests/NoteChange.Tests/NoteChange.Tests.csproj -c Release --nologo

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            [xml]$p = Get-Content src/NoteChange/NoteChange.csproj
            $v = $p.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Conversion tests
        run: dotnet test tests/NoteChange.Tests/NoteChange.Tests.csproj -c Release --nologo

      - name: Build NoteChange.exe
        shell: pwsh
        run: >
          dotnet publish src/NoteChange/NoteChange.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=embedded
          -p:Version=${{ steps.ver.outputs.version }} -o publish -nologo

      - name: Use a full HD screen for screenshots
        continue-on-error: true
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-CimInstance Win32_VideoController | Select-Object CurrentHorizontalResolution, CurrentVerticalResolution

      - name: Test the built app
        shell: pwsh
        run: |
          Get-ChildItem publish | Format-Table Name, Length
          $out = Join-Path $env:RUNNER_TEMP 'self-test'
          $p = Start-Process -FilePath '.\publish\NoteChange.exe' -ArgumentList '--screenshots', "`"$out`"" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Get-Content "$out\self-test.txt" -ErrorAction SilentlyContinue; throw 'The self-test timed out.' }
          $report = Get-Content "$out\self-test.txt" -ErrorAction SilentlyContinue
          $report
          Write-Host ("::notice title=Self-test::" + (($report -join '%0A') -replace '\r', ''))
          if ($p.ExitCode -ne 0) { throw "The self-test failed ($($p.ExitCode))." }

      - name: Share the self-test output for review
        if: always() && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'self-test'
          if (-not (Test-Path $out)) { exit 0 }
          # Pictures of the website too, at desktop and phone widths.
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $edge)) { $edge = "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe" }
          $site = 'file:///' + ((Resolve-Path docs\index.html).Path -replace '\\', '/')
          foreach ($size in @('1440,6400', '390,9000')) {
            $name = if ($size.StartsWith('1440')) { 'site-desktop.png' } else { 'site-phone.png' }
            $p = Start-Process -FilePath $edge -ArgumentList '--headless=new', '--disable-gpu', '--hide-scrollbars', "--window-size=$size", '--virtual-time-budget=8000', "--screenshot=$out\$name", $site -PassThru
            $null = $p.WaitForExit(60000)
          }
          $dir = Join-Path $env:RUNNER_TEMP 'review'
          $remote = "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git init -q $dir
          Copy-Item "$out\*" $dir -Recurse
          Set-Location $dir
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b review-output
          git add -A
          git commit -qm "Self-test output ${{ github.run_number }}"
          $msg = git push -f $remote "HEAD:refs/heads/review/self-test-${{ github.run_number }}" 2>&1
          Write-Host ("::notice title=Review push::" + (($msg | Out-String) -replace "`r?`n", '%0A'))
          exit 0

      - name: Keep the self-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test
          path: ${{ runner.temp }}/self-test

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build Setup.exe
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DPublishDir=..\publish" installer\NoteChange.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "dist\NoteChange-Setup-${{ steps.ver.outputs.version }}.exe" "dist\NoteChange-Setup.exe"
          Get-ChildItem dist

      - name: Test the installer
        shell: pwsh
        run: |
          # WaitForExit waits for Setup itself; Setup opens NoteChange afterwards, which must not block the build.
          $p = Start-Process -FilePath 'dist\NoteChange-Setup.exe' -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=""' -PassThru
          if (-not $p.WaitForExit(180000)) { throw 'Setup timed out.' }
          if ($p.ExitCode -ne 0) { throw "Setup failed ($($p.ExitCode))." }
          Start-Sleep -Seconds 5
          Get-Process NoteChange -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\NoteChange\NoteChange.exe'
          if (-not (Test-Path $exe)) { throw 'NoteChange.exe was not installed.' }
          $installed = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "Installed $installed"
          Write-Host ("::notice title=Installer::Installed NoteChange $installed. Setup is " + [math]::Round((Get-Item 'dist\NoteChange-Setup.exe').Length / 1MB, 1) + " MB.")
          $u = Get-ChildItem "$env:LOCALAPPDATA\Programs\NoteChange" -Filter 'unins*.exe' | Select-Object -First 1
          $p = Start-Process -FilePath $u.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru
          $null = $p.WaitForExit(120000)
          for ($i = 0; $i -lt 20 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw 'Uninstall left NoteChange.exe behind.' }
          Write-Host 'Install and uninstall both worked.'

      - uses: actions/upload-artifact@v4
        with:
          name: NoteChange-Setup-${{ steps.ver.outputs.version }}
          path: dist/NoteChange-Setup.exe

      - name: Is this a new version?
        id: rel
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.ver.outputs.version }}" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { "new=false" >> $env:GITHUB_OUTPUT } else { "new=true" >> $env:GITHUB_OUTPUT }
          $global:LASTEXITCODE = 0

      - name: Publish release
        if: steps.rel.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NoteChange ${{ steps.ver.outputs.version }}
          make_latest: true
          files: dist/NoteChange-Setup.exe
          body: |
            ## Download

            **[NoteChange-Setup.exe](https://github.com/bhxuk/notechange/releases/download/v${{ steps.ver.outputs.version }}/NoteChange-Setup.exe)**, then double-click it. No admin rights needed.

            Windows may show "Windows protected your PC" because the installer isn't code-signed. Click **More info** and then **Run anyway**.

            See the [user guide](https://github.com/bhxuk/notechange/blob/main/docs/USER-GUIDE.md) and [what's new](https://github.com/bhxuk/notechange/blob/main/CHANGELOG.md).
