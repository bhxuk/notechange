name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = 'v' + (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Tag must match $expected" }
      - name: Build review installer
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npm run dist
      - name: Publish tagged release and update manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: NoteChange-Windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
