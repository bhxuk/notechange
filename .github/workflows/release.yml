name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'package*.json', '.github/workflows/release.yml', 'tests/**', 'scripts/**']
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Test the real Windows application
        run: npm run smoke
      - name: Check tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = 'v' + (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Tag must match $expected" }
      - name: Build review installer
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npm run dist
      - name: Publish tagged release and update manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test packaged Windows executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\release\win-unpacked\NoteChange.exe' -ArgumentList '--smoke-test', '--disable-gpu' -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Packaged application test timed out.' }
          if ($process.ExitCode -ne 0) { throw "Packaged application test failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: NoteChange-Windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
      - name: Publish versioned public preview
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($version -notmatch '-beta\.') { Write-Host 'Stable releases use an explicit version tag.'; exit 0 }
          $tag = 'v' + $version
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host 'This version already exists; published files will not be replaced.'; exit 0 }
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Name -match '\.(exe|blockmap)$|^(latest|beta)\.yml$' } | ForEach-Object FullName)
          gh release create $tag @assets --target $env:GITHUB_SHA --prerelease --title "NoteChange $version — public preview" --notes-file docs/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Public preview publication failed.' }
